# Dashboard server for the Docker image. nginx replaces the default server block.
# Security headers are repeated in every location that sets its own add_header,
# because nginx does not inherit server-level add_header into such locations.

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving at request time means nginx starts even if
    # argus is not up yet, and picks it up once it is.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml image/svg+xml font/woff2;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # 'unsafe-inline' for script-src is needed because SvelteKit's bootstrap script is inline.
    # Tighten to hashes or nonces if the SvelteKit csp option is configured at build time.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Immutable, content-hashed build assets: cache for a year.
    location /_app/immutable/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # API proxy. A variable makes nginx resolve argus per request (see resolver above).
    # With a variable and no URI part, the original request URI is passed through unchanged.
    location /v1/ {
        set $argus_upstream http://argus:8080;
        proxy_pass $argus_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        set $argus_upstream http://argus:8080;
        proxy_pass $argus_upstream;
        proxy_set_header Host $host;
        access_log off;
    }

    # Every route is prerendered as <route>/index.html, so $uri/ resolves them.
    # Unknown paths get the SPA fallback shell (404.html, emitted by adapter-static;
    # index.html is the prerendered overview and would hydrate the wrong page).
    # HTML is never cached, so a new deploy takes effect immediately.
    location / {
        try_files $uri $uri/ /404.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    location ~ /\. {
        deny all;
        access_log off;
    }
}
